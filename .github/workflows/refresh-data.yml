# Weekly data refresh: pulls the latest THL Sotkanet and Statistics Finland data, commits the new dataset,
# and redeploys to Vercel, so the app shows current data without anyone touching it.
name: Refresh data

on:
  schedule:
    - cron: "0 5 * * 1" # every Monday 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild dataset from public APIs
        run: npm run data
      - name: Build check
        run: npm run build
      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- lib/data/dataset.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "cancerpath-bot"
            git config user.email "actions@users.noreply.github.com"
            git add lib/data/dataset.json
            git commit -m "Weekly data refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != ''
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
